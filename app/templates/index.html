{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-12 text-center mb-5 mt-3">
        <h1 class="display-5 fw-bold text-dark">探索大學生活，發掘無限可能</h1>
        <p class="lead text-muted">瀏覽並報名最新的校園課外活動</p>
    </div>
</div>

<div class="row g-4">
    {% for activity in activities %}
    <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0 rounded-4">
            <div class="card-body d-flex flex-column p-4">
                <h5 class="card-title fw-bold fs-4">{{ activity.title }}</h5>
                <h6 class="card-subtitle mb-3 mt-1 text-primary">
                    {{ activity.event_time }}
                </h6>
                <p class="card-text text-muted flex-grow-1" style="display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;">
                    {{ activity.description }}
                </p>
                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                    <span class="badge {{ 'bg-danger' if activity.is_full else 'bg-success' }} px-3 py-2 rounded-pill">
                        {{ '已額滿' if activity.is_full else '開放報名中' }}
                    </span>
                    <a href="{{ url_for('main.activity_detail', activity_id=activity.id) }}" class="btn btn-outline-primary btn-sm rounded-pill px-3">查看詳情</a>
                </div>
            </div>
        </div>
    </div>
    {% else %}
    <div class="col-12 text-center">
        <p class="text-muted mt-5 fs-5">目前沒有開放報名的活動，請稍後再回來看看！</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
